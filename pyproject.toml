[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ops-server"
version = "0.1.0"
description = "Production-hardened MCP server with trajectory-level agent evals and a CI eval gate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nikhil" }]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["reportlab>=4", "pillow>=10"]  # briefs (PDF) and the demo GIF
live = ["openai>=3.35,<4"]  # only for the owner-triggered live eval (evals/agents_openai.py)

[tool.hatch.build.targets.wheel]
packages = ["mcp_ops_kit", "mcp_ops_server", "salon_ops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"docs/briefs/*.py" = ["E501"]  # brief text is prose
"evals/golden/make_tasks.py" = ["E501"]  # task prompts and tables are data

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the top-level evals package
