name: Release mcp-ops-kit

# Publishes mcp-ops-kit to PyPI when a tag kit-vX.Y.Z is pushed, through PyPI trusted
# publishing (OIDC): no API token exists anywhere. The tag must name the version in
# mcp_ops_kit/__init__.py, point at a commit on main, and every CI job and CodeQL must have
# passed on that commit. These checks run from the tag's own copy of this file, so they
# are tripwires, not the boundary: the boundary is outside tag-controlled code, in the
# `pypi` environment's required reviewer and tag rule, the repo's tag ruleset, and PyPI's
# publisher config naming this file and that environment. The build job has no write access
# and no OIDC token; only the publish job can mint one, only in the `pypi` environment, and
# it uploads exactly the files the build job checked. The upload carries PEP 740
# attestations (on by default in gh-action-pypi-publish), so PyPI shows which workflow
# built each file. Steps for the owner: comms/STATUS.md (Part 11).

on:
  push:
    tags: ["kit-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read  # to require that CI passed on this commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # to check the tag is on main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: The tag is on main and names a version
        run: |
          VERSION="${GITHUB_REF_NAME#kit-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not kit-vX.Y.Z"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Every CI job and CodeQL passed on this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_ci.py "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - run: pip install -r .github/requirements/kit-release/requirements.txt
      - name: Build (fails unless mcp_ops_kit.__version__ is the tag's version)
        run: python scripts/build_kit.py --out dist --expect-version "$VERSION" --ref "$GITHUB_REF_NAME"
      - name: Check the files, then install the wheel alone in a fresh venv and use it
        run: |
          python scripts/check_kit_dist.py check dist
          twine check --strict dist/*
          python -m venv "$RUNNER_TEMP/kit"
          "$RUNNER_TEMP/kit/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/kit/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_kit_dist.py" smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kit-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-ops-kit/
    permissions:
      id-token: write  # trusted publishing and attestations; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kit-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
