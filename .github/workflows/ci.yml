name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # live: the real OpenAI SDK, so its tests run against a local fake endpoint (no key)
      - run: pip install -e ".[dev,live]"
      - run: pytest -q

  evals:
    # The eval gate: every golden task replayed against the real server over HTTP, and every
    # negative control caught by the grader, for the clinic and for the salon example. Free
    # and deterministic (no model, no secrets). Both suites run even if the first fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run eval suite (replay agent)
        run: python -m evals.run --out eval-results.json --report eval-report.md
      - name: Run the salon example's eval suite (replay agent)
        if: always()
        run: python -m salon_ops.evals.run --out salon-eval-results.json --report salon-eval-report.md
      - name: Publish reports to the job summary
        if: always()
        run: |
          test -f eval-report.md && cat eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
          test -f salon-eval-report.md && cat salon-eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            eval-report.md
            eval-results.json
            salon-eval-report.md
            salon-eval-results.json
          if-no-files-found: ignore

  fhir:
    # Backend parity: the whole test suite with every tool test run on SQLite and on a real
    # FHIR R4 server, then the eval gate on FHIR. HAPI is pinned by digest and gets only
    # synthetic data (fhir_seed). The image has no health check, so the wait below polls
    # /metadata and fails loudly; tests never skip a missing server.
    runs-on: ubuntu-latest
    services:
      hapi:
        image: hapiproject/hapi:v8.4.0-2@sha256:e60b0a2063db0c8ee65fc34206aed9df232a39d5e29ee37fdd9df74551895cd6
        ports:
          - 8080:8080
    env:
      MCP_OPS_TEST_BACKENDS: sqlite,fhir
      MCP_OPS_TEST_FHIR_URL: http://127.0.0.1:8080/fhir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,live]"
      - name: Wait for HAPI FHIR
        run: |
          for i in $(seq 1 90); do
            curl -sf "$MCP_OPS_TEST_FHIR_URL/metadata" -o /dev/null && exit 0
            sleep 2
          done
          echo "::error::HAPI FHIR did not answer $MCP_OPS_TEST_FHIR_URL/metadata within 180 s"
          docker logs "${{ job.services.hapi.id }}" 2>&1 | tail -50
          exit 1
      - name: Load the synthetic seed
        run: python -m mcp_ops_server.backends.fhir_seed load --url "$MCP_OPS_TEST_FHIR_URL"
      - name: Tests on both backends
        run: pytest -q
      - name: Eval gate on FHIR (replay agent)
        run: >
          python -m evals.run --backend fhir --fhir-url "$MCP_OPS_TEST_FHIR_URL"
          --out fhir-eval-results.json --report fhir-eval-report.md
      - name: Publish report to the job summary
        if: always()
        run: test -f fhir-eval-report.md && cat fhir-eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fhir-eval-results
          path: |
            fhir-eval-report.md
            fhir-eval-results.json
          if-no-files-found: ignore

  container:
    # Builds the production image and tests it as shipped: the container must turn healthy,
    # refuse /mcp without a token, and complete a real tool round trip (search, book,
    # cancel, each write read back) over HTTP. On main, this exact tested image is handed
    # to the publish job; nothing is rebuilt between testing and publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"  # the smoke test's MCP client
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t mcp-ops-server:ci .
      - name: Issue a throwaway token and start the container
        run: |
          mkdir -p ctdata
          TOKEN=$(docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/ctdata:/data" \
            mcp-ops-server:ci python -m mcp_ops_server.auth issue --file /data/tokens.json \
            --client ci-smoke --scope read:schedule --scope write:schedule --scope read:referrals)
          echo "::add-mask::$TOKEN"
          echo "MCP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          docker run -d --name mcpops -p 8000:8000 -v "$PWD/ctdata:/data:ro" mcp-ops-server:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mcpops)" = healthy ] && exit 0
            sleep 1
          done
          echo "::error::container did not become healthy"
          exit 1
      - name: Smoke test against the container
        env:
          MCP_URL: http://127.0.0.1:8000
        run: python scripts/smoke_test.py
      - name: Health check follows MCP_OPS_PORT
        run: |
          docker run -d --name mcpops9000 -e MCP_OPS_PORT=9000 -v "$PWD/ctdata:/data:ro" \
            mcp-ops-server:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mcpops9000)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 1
          done
          echo "::error::container on port 9000 did not become healthy ($status)"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs mcpops || true
      - name: Save the tested image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker image inspect -f '{{.Id}}' mcp-ops-server:ci > image-id.txt
          docker save mcp-ops-server:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image
          path: |
            image.tar.gz
            image-id.txt
          retention-days: 1

  publish:
    # Pushes the image that the container job tested (loaded from its artifact, ID checked)
    # to GitHub Container Registry. Only from main, only after every check passed, and the
    # only job with write access to packages; PRs never reach it. Runs one at a time, and
    # only the run for the current head of main moves `latest`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, evals, fhir, container, secrets]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
      - name: Load the tested image and check it is the same one
        run: |
          gunzip -c image.tar.gz | docker load
          test "$(docker image inspect -f '{{.Id}}' mcp-ops-server:ci)" = "$(cat image-id.txt)"
      - name: Push sha tag, and latest if this commit is still the head of main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag mcp-ops-server:ci "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            docker tag mcp-ops-server:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            echo "::notice::main moved on to ${HEAD_SHA::7}; not moving latest to this older commit"
          fi

  secrets:
    # Runs on push AND pull_request (fork PRs never trigger this repo's push runs).
    # Uses the gitleaks CLI directly: no action-specific PR logic, no tokens, and the
    # pull_request event gives fork code a read-only token with no repo secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history for secrets
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:latest git /repo --no-banner --redact --exit-code 1
