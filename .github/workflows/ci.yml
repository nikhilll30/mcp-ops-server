name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # live: the real OpenAI SDK, so its tests run against a local fake endpoint (no key)
      - run: pip install -e ".[dev,live]"
      - run: pytest -q

  evals:
    # The eval gate: every golden task replayed against the real server over HTTP, and every
    # negative control caught by the grader, for the clinic and for the salon example. Free
    # and deterministic (no model, no secrets). Both suites run even if the first fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run eval suite (replay agent)
        run: python -m evals.run --out eval-results.json --report eval-report.md
      - name: Run the salon example's eval suite (replay agent)
        if: always()
        run: python -m salon_ops.evals.run --out salon-eval-results.json --report salon-eval-report.md
      - name: Publish reports to the job summary
        if: always()
        run: |
          test -f eval-report.md && cat eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
          test -f salon-eval-report.md && cat salon-eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: eval-results
          path: |
            eval-report.md
            eval-results.json
            salon-eval-report.md
            salon-eval-results.json
          if-no-files-found: ignore

  fhir:
    # Backend parity: the whole test suite with every tool test run on SQLite and on a real
    # FHIR R4 server, then the eval gate on FHIR. HAPI is pinned by digest and gets only
    # synthetic data (fhir_seed). The image has no health check, so the wait below polls
    # /metadata and fails loudly; tests never skip a missing server.
    runs-on: ubuntu-latest
    services:
      hapi:
        image: hapiproject/hapi:v8.4.0-2@sha256:e60b0a2063db0c8ee65fc34206aed9df232a39d5e29ee37fdd9df74551895cd6
        ports:
          - 8080:8080
    env:
      MCP_OPS_TEST_BACKENDS: sqlite,fhir
      MCP_OPS_TEST_FHIR_URL: http://127.0.0.1:8080/fhir
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,live]"
      - name: Wait for HAPI FHIR
        run: |
          for i in $(seq 1 90); do
            curl -sf "$MCP_OPS_TEST_FHIR_URL/metadata" -o /dev/null && exit 0
            sleep 2
          done
          echo "::error::HAPI FHIR did not answer $MCP_OPS_TEST_FHIR_URL/metadata within 180 s"
          docker logs "${{ job.services.hapi.id }}" 2>&1 | tail -50
          exit 1
      - name: Load the synthetic seed
        run: python -m mcp_ops_server.backends.fhir_seed load --url "$MCP_OPS_TEST_FHIR_URL"
      - name: Tests on both backends
        run: pytest -q
      - name: Eval gate on FHIR (replay agent)
        run: >
          python -m evals.run --backend fhir --backend-url "$MCP_OPS_TEST_FHIR_URL"
          --out fhir-eval-results.json --report fhir-eval-report.md
      - name: Publish report to the job summary
        if: always()
        run: test -f fhir-eval-report.md && cat fhir-eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: fhir-eval-results
          path: |
            fhir-eval-report.md
            fhir-eval-results.json
          if-no-files-found: ignore

  container:
    # Builds the production image and tests it as shipped: the container must turn healthy,
    # refuse /mcp without a token, and complete a real tool round trip (search, book,
    # cancel, each write read back) over HTTP. On main, this exact tested image is handed
    # to the publish job; nothing is rebuilt between testing and publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"  # the smoke test's MCP client
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t mcp-ops-server:ci .
      - name: Issue a throwaway token and data key, and start the container
        run: |
          mkdir -p ctdata
          TOKEN=$(docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/ctdata:/data" \
            mcp-ops-server:ci python -m mcp_ops_server.auth issue --file /data/tokens.json \
            --client ci-smoke --scope read:schedule --scope write:schedule --scope read:referrals)
          echo "::add-mask::$TOKEN"
          echo "MCP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          KEY=$(docker run --rm mcp-ops-server:ci python -m mcp_ops_kit.crypto new-key)
          echo "::add-mask::$KEY"
          echo "MCP_OPS_DATA_KEY=$KEY" >> "$GITHUB_ENV"  # for later steps
          export MCP_OPS_DATA_KEY="$KEY"  # $GITHUB_ENV does not reach this step's own shell
          # Without a data key the image must refuse to start (fail closed), with one line.
          if docker run --rm -v "$PWD/ctdata:/data:ro" mcp-ops-server:ci > nokey.log 2>&1; then
            echo "::error::the container started without MCP_OPS_DATA_KEY"; exit 1
          fi
          grep -q "MCP_OPS_DATA_KEY are both required" nokey.log
          # Hardened as infra/aws's task definition runs it: read-only root filesystem, no
          # Linux capabilities, no privilege escalation. Only /audit is writable.
          docker run -d --name mcpops -p 8000:8000 -v "$PWD/ctdata:/data:ro" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v mcpops-audit:/audit -e MCP_OPS_DATA_KEY mcp-ops-server:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mcpops)" = healthy ] && exit 0
            sleep 1
          done
          echo "::error::container did not become healthy"
          exit 1
      - name: Smoke test against the container
        env:
          MCP_URL: http://127.0.0.1:8000
        run: python scripts/smoke_test.py
      - name: The smoke test's calls are in the container's audit log, chain intact
        run: |
          docker exec mcpops python -m mcp_ops_kit.audit verify --file /audit/audit.log \
            --key-env MCP_OPS_DATA_KEY | tee verify.log
          # the smoke test makes 7 tool calls: health, search, 3 x list, book, cancel
          COUNT=$(sed -E 's/^ok: ([0-9]+) records.*/\1/' verify.log)
          test "$COUNT" -ge 7
      - name: Health check follows MCP_OPS_PORT
        run: |
          docker run -d --name mcpops9000 -e MCP_OPS_PORT=9000 -v "$PWD/ctdata:/data:ro" \
            -e MCP_OPS_DATA_KEY mcp-ops-server:ci
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mcpops9000)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 1
          done
          echo "::error::container on port 9000 did not become healthy ($status)"
          exit 1
      - name: Cache cosign and syft (built from the pinned versions in the install script)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.local/supply-chain
          key: supply-chain-${{ hashFiles('scripts/install_supply_chain_tools.sh') }}
      - name: Install cosign and syft
        run: |
          scripts/install_supply_chain_tools.sh "$HOME/.local/supply-chain"
          echo "$HOME/.local/supply-chain" >> "$GITHUB_PATH"
      - name: SBOM, signature and SBOM attestation, verified (throwaway key, local registry)
        # The same script and commands the publish job runs keyless on main, on this image.
        # No transparency log and no OIDC token: nothing from a PR reaches Sigstore.
        run: |
          docker run -d --name registry -p 5000:5000 \
            registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          for i in $(seq 1 30); do curl -sf http://localhost:5000/v2/ -o /dev/null && break; sleep 1; done
          push() {  # tag, push, print IMAGE@DIGEST (the digest the registry stored)
            docker tag "$1" "$2" && docker push "$2" | tee /dev/stderr \
              | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -1 | sed "s|^|${2%:*}@|"
          }
          REF=$(push mcp-ops-server:ci localhost:5000/mcp-ops-server:ci)
          scripts/supply_chain.sh sbom "$REF" sbom.spdx.json
          export COSIGN_PASSWORD=""
          KEYS="$RUNNER_TEMP/keys" && mkdir -p "$KEYS"
          cosign generate-key-pair --output-key-prefix "$KEYS/ci"
          cosign generate-key-pair --output-key-prefix "$KEYS/other"
          COSIGN_KEY="$KEYS/ci.key" scripts/supply_chain.sh sign "$REF" sbom.spdx.json
          COSIGN_PUBLIC_KEY="$KEYS/ci.pub" scripts/supply_chain.sh verify "$REF"
          # Verification must be able to fail: another key, and an image that has only the
          # SBOM attestation (cosign v3's own `verify` accepts that one; ours must not).
          if COSIGN_PUBLIC_KEY="$KEYS/other.pub" scripts/supply_chain.sh verify "$REF"; then
            echo "::error::verify accepted a signature made with another key"; exit 1
          fi
          printf 'FROM mcp-ops-server:ci\nLABEL attest-only=1\n' | docker build -q -t attest-only -
          ONLY=$(push attest-only localhost:5000/attest-only:ci)
          SC=$(mktemp) && cosign signing-config create --out "$SC"
          cosign attest --yes --key "$KEYS/ci.key" --signing-config "$SC" \
            --type spdxjson --predicate sbom.spdx.json "$ONLY"
          if COSIGN_PUBLIC_KEY="$KEYS/ci.pub" scripts/supply_chain.sh verify "$ONLY"; then
            echo "::error::verify accepted an image with an attestation but no signature"; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
      - name: Container logs
        if: always()
        run: docker logs mcpops || true
      - name: Save the tested image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker image inspect -f '{{.Id}}' mcp-ops-server:ci > image-id.txt
          docker save mcp-ops-server:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image
          path: |
            image.tar.gz
            image-id.txt
            sbom.spdx.json
          retention-days: 1

  terraform:
    # The AWS blueprint (infra/aws), validated and never applied: no AWS credentials exist in
    # this repo, and terraform test runs against a mocked provider. Binaries are pinned by
    # version and SHA-256; the provider by .terraform.lock.hcl.
    runs-on: ubuntu-latest
    env:
      TF_VERSION: 1.16.5
      TF_SHA256: 2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4
      TFLINT_VERSION: 0.64.0
      TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
      CHECKOV_VERSION: 3.3.30
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install terraform and tflint (pinned, hash-checked)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfLo tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "$TF_SHA256  tf.zip" | sha256sum -c
          curl -sSfLo tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "$TFLINT_SHA256  tflint.zip" | sha256sum -c
          unzip -q tf.zip terraform -d "$RUNNER_TEMP/bin"
          unzip -q tflint.zip tflint -d "$RUNNER_TEMP/bin"
          rm tf.zip tflint.zip
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init (no backend; provider checked against the lock file)
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: terraform validate
        run: terraform validate
      - name: terraform test (mocked AWS provider; nothing is created)
        run: terraform test
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}  # read-only; avoids the plugin download rate limit
        run: |
          tflint --init
          tflint --format compact
      - name: checkov
        run: |
          pip install "checkov==${CHECKOV_VERSION}"
          checkov -d . --framework terraform --compact --quiet --skip-download
      - name: HIPAA-eligible services, no open CIDRs, settings and uid match the server
        working-directory: .
        run: python scripts/check_infra.py

  package:
    # mcp-ops-kit as PyPI would get it: built from a staged copy (sdist, then the wheel from
    # the sdist), the files checked (only the kit, the right version and dependencies),
    # twine's metadata check, then the wheel alone in a fresh venv, used as a domain would.
    # The release workflow (release-kit.yml) runs the same steps before it publishes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "build==1.6.1" "twine==7.0.0"
      - name: Build mcp-ops-kit
        run: python scripts/build_kit.py --out dist
      - name: Check the files, then install the wheel alone in a fresh venv and use it
        run: |
          python scripts/check_kit_dist.py check dist
          twine check --strict dist/*
          python -m venv "$RUNNER_TEMP/kit"
          "$RUNNER_TEMP/kit/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/kit/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_kit_dist.py" smoke

  publish:
    # Pushes the image that the container job tested (loaded from its artifact, ID checked)
    # to GitHub Container Registry, then signs it keyless (Sigstore, this workflow's OIDC
    # identity), attests the tested image's SBOM, and verifies both before it moves
    # `latest`. Only from main, only after every check passed, and the only job with write
    # access to packages or an OIDC token; PRs never reach it. Runs one at a time, and only
    # the run for the current head of main moves `latest`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, evals, fhir, container, terraform, package, secrets]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless signing: a short-lived certificate for this workflow on main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: tested-image
      - name: Load the tested image and check it is the same one
        run: |
          gunzip -c image.tar.gz | docker load
          test "$(docker image inspect -f '{{.Id}}' mcp-ops-server:ci)" = "$(cat image-id.txt)"
      - name: Cache cosign and syft (built from the pinned versions in the install script)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.local/supply-chain
          key: supply-chain-${{ hashFiles('scripts/install_supply_chain_tools.sh') }}
      - name: Install cosign and syft
        run: |
          scripts/install_supply_chain_tools.sh "$HOME/.local/supply-chain"
          echo "$HOME/.local/supply-chain" >> "$GITHUB_PATH"
      - name: Push the sha tag, sign it and attest its SBOM, verify, then move latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag mcp-ops-server:ci "$IMAGE:sha-${GITHUB_SHA::7}"
          DIGEST=$(docker push "$IMAGE:sha-${GITHUB_SHA::7}" | tee /dev/stderr \
            | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -1)
          test -n "$DIGEST"
          # Signed by digest; `latest` and the sha tag both name this digest.
          scripts/supply_chain.sh sign "$IMAGE@$DIGEST" sbom.spdx.json
          scripts/supply_chain.sh verify "$IMAGE@$DIGEST"
          echo "::notice::signed $IMAGE@$DIGEST"
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            docker tag mcp-ops-server:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            echo "::notice::main moved on to ${HEAD_SHA::7}; not moving latest to this older commit"
          fi

  secrets:
    # Runs on push AND pull_request (fork PRs never trigger this repo's push runs).
    # Uses the gitleaks CLI directly: no action-specific PR logic, no tokens, and the
    # pull_request event gives fork code a read-only token with no repo secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan full git history for secrets
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --exit-code 1
