name: Live evals

# Paid: runs a suite (the golden tasks, or the prompt-injection tasks) with a real OpenAI
# model, each task `repeats` times on fresh data. Owner-triggered only (Actions > Live evals >
# Run workflow); never on push or pull_request. Spend scales with tasks x repeats; the CLI
# refuses more than 20 repeats, and the OpenAI project's hard limit caps the rest.
#
# The key is an *environment* secret of the "live-evals" environment, whose deployment
# branches are limited to main (Settings > Environments). GitHub enforces that limit
# server-side, so dispatching this workflow on an unreviewed branch (whose copy of this file
# could drop any in-file check) cannot reach the key. Do not also store it as a repo secret.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Exact OpenAI model ID"
        required: true
        type: string
      suite:
        description: "Which tasks: golden (31) or injection (6)"
        required: true
        type: choice
        options: [golden, injection]
        default: golden
      repeats:
        description: "Runs per task, 1 to 20 (pass^k and per-task variance need 2 or more)"
        required: true
        type: string
        default: "1"
      tasks:
        description: "Comma-separated task IDs (empty = the whole suite)"
        required: false
        type: string
        default: ""
      reasoning_effort:
        description: "Reasoning effort, e.g. low / medium / high (empty = model default)"
        required: false
        type: string
        default: ""
      price_in:
        description: "USD per 1M input tokens (optional, for the cost line)"
        required: false
        type: string
        default: ""
      price_out:
        description: "USD per 1M output tokens (optional, for the cost line)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: live-evals
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    # The report is written only when every run has finished, so a timeout throws away the
    # paid runs. 31 tasks x 20 repeats at Part 5's p99 task latency (36 s) is about 6 hours,
    # so the limit is GitHub's maximum for a hosted runner; spend stays capped by the OpenAI
    # project's hard limit (Cursor Bugbot, PR #28: it was 30 minutes).
    timeout-minutes: 360
    environment: live-evals
    steps:
      - name: Only main runs live evals
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Live evals run only on main (got $GITHUB_REF)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,live]"
      - name: Check the API key secret is set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set as a secret of the live-evals environment (Settings > Environments > live-evals)."
            exit 1
          fi
      - name: Run live evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Inputs go through env, never interpolated into the script.
          MODEL: ${{ inputs.model }}
          SUITE: ${{ inputs.suite }}
          REPEATS: ${{ inputs.repeats }}
          TASKS: ${{ inputs.tasks }}
          EFFORT: ${{ inputs.reasoning_effort }}
          PRICE_IN: ${{ inputs.price_in }}
          PRICE_OUT: ${{ inputs.price_out }}
        run: |
          args=(--agent openai --model "$MODEL" --suite "$SUITE" --repeats "$REPEATS")
          args+=(--out live-results.json --report live-report.md)
          if [ -n "$TASKS" ]; then args+=(--tasks "$TASKS"); fi
          if [ -n "$EFFORT" ]; then args+=(--reasoning-effort "$EFFORT"); fi
          if [ -n "$PRICE_IN" ] || [ -n "$PRICE_OUT" ]; then
            args+=(--price-in "$PRICE_IN" --price-out "$PRICE_OUT")
          fi
          python -m evals.run "${args[@]}"
      - name: Publish report to the job summary
        if: always()
        run: test -f live-report.md && cat live-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: live-eval-results
          path: |
            live-report.md
            live-results.json
          if-no-files-found: ignore
