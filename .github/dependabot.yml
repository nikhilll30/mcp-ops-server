# Dependabot opens PRs for updates; each one runs the full CI (tests, both eval gates, the
# FHIR parity job, the container and terraform jobs) like any other PR, and the owner merges.
# Security updates arrive as they are published; version updates are weekly and grouped,
# so the owner reviews a handful of PRs a week, not one per package.
version: 2
updates:
  - package-ecosystem: pip  # pyproject.toml (the image) and the kit's packaging/ copy
    directories: ["/", "/packaging/mcp-ops-kit"]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions  # every action is pinned by SHA; this bumps the SHA
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker  # the Dockerfile's base image, pinned by digest
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform  # infra/aws provider (lock file)
    directory: /infra/aws
    schedule:
      interval: weekly
